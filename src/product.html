<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product - SHOP.CO</title>
    <link href="./output.css" rel="stylesheet" />
  </head>
  <body class="bg-white text-black">
    <header id="siteHeader"></header>

    <main
      id="productDetail"
      class="mx-auto max-w-[1280px] px-4 py-8 md:px-8 lg:px-12"
    ></main>
    <section id="section2" class="bg-black p-6 md:p-10"></section>
    <footer id="siteFooter"></footer>

    <script src="./header.js"></script>
    <script src="./product.js"></script>
    <script src="./cart.js"></script>
    <script src="./section2.js"></script>
    <script src="./footer.js"></script>
    <script>
      const productName = new URLSearchParams(window.location.search).get(
        "name",
      );
      const product =
        products.find((item) => item.name === productName) || products[0];
      document.title = `${product.name} - SHOP.CO`;

      const sizes = ["S", "M", "L", "XL", "XXL"];
      const colours = [
        { name: "Moss", value: "#6c7b5b", filter: "none" },
        {
          name: "Black",
          value: "#1c1c1e",
          filter: "grayscale(1) brightness(0.38)",
        },
        {
          name: "Cream",
          value: "#d7d2c7",
          filter: "sepia(0.25) saturate(0.55) brightness(1.28)",
        },
        {
          name: "Navy",
          value: "#1a2c46",
          filter: "hue-rotate(165deg) saturate(1.35) brightness(0.72)",
        },
      ];

      const reviews = [
        {
          author: "Sarah M.",
          quote:
            "The fit is excellent and the fabric feels premium. It looks even better in person.",
          date: "April 2024",
        },
        {
          author: "James T.",
          quote:
            "Very comfortable and easy to style. I get compliments every time I wear it.",
          date: "May 2024",
        },
        {
          author: "Emma L.",
          quote:
            "The quality exceeded my expectations, and the print keeps its sharp look after washing.",
          date: "June 2024",
        },
        {
          author: "Naomi K.",
          quote:
            "A perfect everyday tee. The colour is rich, and the cut is flattering without being tight.",
          date: "July 2024",
        },
      ];

      const galleryImages =
        product.name === "ONE LIFE GRAPHIC T-SHIRT"
          ? ["image 1.png", "image 2.png", "image 5.png", "image 6.png"]
          : [product.image, "image 2.png", "image 5.png", "image 6.png"];

      document.getElementById("productDetail").innerHTML = `
        <div class="mx-auto max-w-[1240px]">
          <div class="grid gap-4 md:grid-cols-[minmax(0,1fr)_minmax(240px,1fr)] md:items-start lg:grid-cols-[minmax(0,0.78fr)_minmax(420px,1.22fr)] lg:gap-8">
            <div>
              <p class="mb-4 text-xl font-black tracking-[-0.04em] text-black md:text-2xl">SHOP.CO / CASUAL</p>
              <div id="productGallery" class="flex scroll-mt-24 gap-4 md:gap-6">
              <div class="flex w-24 shrink-0 flex-col gap-4 md:w-32">
                ${galleryImages
                  .map(
                    (image, index) => `
                      <button type="button" class="gallery-thumb overflow-hidden rounded-xl border ${index === 0 ? "border-black" : "border-transparent"} bg-[#f4f4f4] p-1.5" data-image="${image}" aria-label="View product image ${index + 1}">
                        <img src="./Assests/image/${image}" alt="" class="aspect-square w-full object-contain" />
                      </button>
                    `,
                  )
                  .join("")}
              </div>
              <div class="flex min-h-[432px] min-w-0 flex-1 items-center justify-start overflow-hidden rounded-xl bg-[#f4f4f4] px-3 py-4 pl-6 md:min-h-[560px] md:pl-10 lg:min-h-[440px] lg:pl-12">
                <img id="productMainImage" src="./Assests/image/${galleryImages[0]}" alt="${product.name}" class="h-[160px] w-full max-w-[200px] object-contain transition-transform duration-300 md:h-[220px] md:max-w-[240px] lg:h-[190px] lg:max-w-[220px]" />
              </div>
              </div>
            </div>

            <section class="min-w-0 pt-1 md:pt-3">
              <h1 class="mt-3 text-2xl font-black leading-none tracking-[-0.05em] text-black md:text-3xl">${product.name}</h1>

              <div class="mt-3 flex items-center gap-2 text-orange-500">
                <span class="flex items-center gap-1">${ratingStars(product.star)}</span>
                <span class="text-sm font-bold text-black">${product.star}/5</span>
                <button type="button" data-scroll-target="reviewsSection" class="text-xs text-gray-500 underline-offset-2 hover:underline">• 120 Reviews</button>
              </div>

              <div class="mt-3 flex items-center gap-3">
                <p class="text-2xl font-bold leading-none text-black md:text-3xl">$${product.price}</p>
                <p class="text-lg text-gray-400 line-through">$${product.price + 60}</p>
                <span class="rounded-full bg-orange-100 px-2 py-1 text-[10px] font-semibold text-orange-600">-20%</span>
              </div>

              <p class="mt-4 max-w-[620px] text-sm leading-6 text-black/65">
                A relaxed, everyday graphic T-shirt designed for comfort and all-day wear. The premium cotton blend keeps it soft and breathable, while the bold print adds a modern edge to your look.
              </p>

              <div class="mt-5 border-t border-b border-black/10 py-4">
                <div class="flex items-center justify-between">
                  <p class="text-sm font-semibold uppercase tracking-[0.12em] text-black/50">Select Size</p>
                  <a href="#" class="text-sm font-medium text-black underline">Size Guide</a>
                </div>
                <div class="mt-4 flex flex-wrap gap-3">
                  ${sizes
                    .map(
                      (size) => `
                        <button type="button" data-size="${size}" class="size-button flex h-11 w-11 items-center justify-center rounded-full border text-sm font-medium ${size === "L" ? "border-black bg-black text-white" : "border-black/10 bg-white text-black"}">
                          ${size}
                        </button>
                      `,
                    )
                    .join("")}
                </div>
              </div>

              <div class="mt-5">
                <p class="text-sm font-semibold uppercase tracking-[0.12em] text-black/50">Colour</p>
                <div class="mt-4 flex gap-3">
                  ${colours
                    .map(
                      (colour) => `
                        <button type="button" data-color="${colour.name}" data-filter="${colour.filter}" class="swatch h-9 w-9 rounded-full border-2 border-white shadow-sm ring-1 ring-black/10 ${colour.name === "Black" ? "ring-black" : ""}" style="background-color: ${colour.value};" aria-label="${colour.name}" title="${colour.name}"></button>
                      `,
                    )
                    .join("")}
                </div>
              </div>

              <div class="mt-5 space-y-3">
                <div class="flex max-w-[180px] items-center justify-between rounded-full border border-black/10 bg-[#f7f7f7] px-2 py-1">
                  <button id="productMinus" type="button" aria-label="Decrease quantity" class="flex h-12 w-12 items-center justify-center rounded-full hover:bg-white">
                    <img src="./Assests/image/icons8-minus-24.png" alt="Decrease quantity" class="h-5 w-5" />
                  </button>
                  <span id="productQuantity" class="min-w-8 text-center text-lg font-bold text-black">1</span>
                  <button id="productPlus" type="button" aria-label="Increase quantity" class="flex h-12 w-12 items-center justify-center rounded-full hover:bg-white">
                    <img src="./Assests/image/icons8-plus-24.png" alt="Increase quantity" class="h-5 w-5" />
                  </button>
                </div>

                <button id="detailAddToCart" type="button" class="w-full rounded-full bg-black px-6 py-3 text-sm font-semibold text-white transition hover:bg-gray-900">
                  Add to Cart
                </button>
                <a id="detailBuyNow" href="./checkout.html" class="block w-full rounded-full border border-black/10 bg-white px-6 py-3 text-center text-sm font-semibold text-black transition hover:border-black">
                  Buy Now
                </a>
              </div>
            </section>
          </div>

          <div class="mt-12 flex flex-nowrap items-center justify-between overflow-x-auto border-b border-black/10 pb-2 text-base font-bold whitespace-nowrap md:text-lg">
            <button type="button" data-scroll-target="productGallery" class="shrink-0 border-b-2 border-black px-2 pb-5 md:px-4">Product Details</button>
            <button type="button" data-scroll-target="reviewsSection" class="shrink-0 border-b-2 border-black px-2 pb-5 md:px-4">Rating &amp; Reviews</button>
            <button type="button" class="shrink-0 px-2 pb-5 text-black/50 md:px-4">FAQs</button>
          </div>

          <section id="reviewsSection" class="scroll-mt-24 mt-6">
            <div class="mb-4 flex items-center justify-between gap-4">
              <h2 class="text-lg font-black tracking-[-0.04em] text-black md:text-2xl">All Reviews <span class="text-sm font-normal text-black/50">(120)</span></h2>
              <div class="flex items-center gap-2">
                <button type="button" data-scroll-target="relatedSection" class="rounded-full border border-black/10 px-3 py-2 text-xs">Latest</button>
                <button type="button" data-scroll-target="reviewForm" class="rounded-full bg-black px-4 py-2 text-xs font-semibold text-white">Write a Review</button>
              </div>
            </div>

            <div class="grid grid-cols-2 items-stretch gap-3">
              ${reviews
                .map(
                  (review) => `
                    <article class="flex min-h-[140px] min-w-0 flex-col rounded-2xl border border-black/10 bg-white p-3 shadow-sm">
                      <div class="flex items-center gap-1 text-orange-500">${ratingStars(5)}</div>
                      <h3 class="mt-2 text-base font-semibold text-black">${review.author}</h3>
                      <p class="mt-2 text-xs leading-5 text-black/70">“${review.quote}”</p>
                      <p class="mt-2 text-[10px] font-medium uppercase tracking-[0.12em] text-black/45">${review.date}</p>
                    </article>
                  `,
                )
                .join("")}
            </div>
          </section>

          <form id="reviewForm" class="hidden scroll-mt-24 mt-10 rounded-2xl border border-black/10 bg-[#f7f7f7] p-5 md:p-6">
            <h2 class="text-lg font-bold">Write a Review</h2>
            <div class="mt-4 grid gap-3 md:grid-cols-2">
              <input required type="text" placeholder="Your name" class="rounded-xl border border-black/10 bg-white px-4 py-3 text-sm outline-none focus:border-black" />
              <select required class="rounded-xl border border-black/10 bg-white px-4 py-3 text-sm outline-none focus:border-black">
                <option value="">Choose a rating</option>
                <option>5 stars</option>
                <option>4 stars</option>
                <option>3 stars</option>
                <option>2 stars</option>
                <option>1 star</option>
              </select>
            </div>
            <textarea required rows="4" placeholder="Share your experience" class="mt-3 w-full rounded-xl border border-black/10 bg-white px-4 py-3 text-sm outline-none focus:border-black"></textarea>
            <button type="submit" class="mt-3 rounded-full bg-black px-5 py-3 text-sm font-semibold text-white">Submit Review</button>
            <p id="reviewFormMessage" class="mt-3 hidden text-sm text-green-700">Thanks, your review has been submitted.</p>
          </form>

          <section id="relatedSection" class="scroll-mt-24 mt-16 pb-12">
            <div class="mb-8 flex items-center justify-between gap-4">
              <h2 class="text-2xl font-black tracking-[-0.05em] text-black md:text-4xl">YOU MIGHT ALSO LIKE</h2>
              <a href="category.html" class="hidden rounded-full border border-black/15 px-5 py-3 text-sm font-medium text-black md:inline-flex">View All</a>
            </div>
            <div id="relatedProducts" class="flex flex-wrap items-stretch gap-5 pb-2 lg:flex-nowrap lg:overflow-visible"></div>
          </section>
        </div>
      `;

      document.querySelectorAll("[data-scroll-target]").forEach((button) => {
        button.addEventListener("click", () => {
          if (button.dataset.scrollTarget === "reviewForm") {
            document.getElementById("reviewForm")?.classList.remove("hidden");
          }
          document
            .getElementById(button.dataset.scrollTarget)
            ?.scrollIntoView({ behavior: "smooth", block: "start" });
        });
      });

      document
        .getElementById("reviewForm")
        ?.addEventListener("submit", (event) => {
          event.preventDefault();
          event.currentTarget.reset();
          document
            .getElementById("reviewFormMessage")
            .classList.remove("hidden");
        });

      const productMainImage = document.getElementById("productMainImage");
      const sizeScale = { S: 1, M: 1.08, L: 1.16, XL: 1.24, XXL: 1.32 };
      const updateProductImageSize = (size) => {
        productMainImage.style.transform = `scale(${sizeScale[size] || 1})`;
      };
      const defaultColorButton = document.querySelector(
        '.swatch[data-color="Black"]',
      );
      productMainImage.style.filter =
        defaultColorButton?.dataset.filter || "none";
      updateProductImageSize("L");
      document.querySelectorAll(".gallery-thumb").forEach((thumbnail) => {
        thumbnail.addEventListener("click", (event) => {
          event.preventDefault();
          const thumbnailImage = thumbnail.querySelector("img");
          productMainImage.src = thumbnailImage.src;
          productMainImage.alt = thumbnailImage.alt || product.name;
          document.querySelectorAll(".gallery-thumb").forEach((item) => {
            item.classList.remove("border-black");
            item.classList.add("border-transparent");
            item.removeAttribute("aria-current");
          });
          thumbnail.classList.remove("border-transparent");
          thumbnail.classList.add("border-black");
          thumbnail.setAttribute("aria-current", "true");
        });
      });

      const productQuantity = document.getElementById("productQuantity");
      let selectedSize = "L";
      let selectedColor = "Black";
      const updateProductQuantity = () => {
        const item = getSavedCart().find(
          (cartItem) =>
            cartItem.name === product.name &&
            (cartItem.size || "Not selected") === selectedSize &&
            (cartItem.color || "Not selected") === selectedColor,
        );
        productQuantity.textContent = item?.quantity || 0;
      };

      const addCurrentProductToCart = () => {
        addToCart(product.name, { size: selectedSize, color: selectedColor });
        updateProductQuantity();
      };

      document.querySelectorAll(".size-button").forEach((button) => {
        button.addEventListener("click", () => {
          selectedSize = button.dataset.size;
          updateProductImageSize(selectedSize);
          document.querySelectorAll(".size-button").forEach((sizeButton) => {
            sizeButton.classList.remove(
              "border-black",
              "bg-black",
              "text-white",
            );
            sizeButton.classList.add(
              "border-black/10",
              "bg-white",
              "text-black",
            );
          });
          button.classList.remove("border-black/10", "bg-white", "text-black");
          button.classList.add("border-black", "bg-black", "text-white");
          updateProductQuantity();
        });
      });

      document.querySelectorAll(".swatch").forEach((button) => {
        button.addEventListener("click", () => {
          selectedColor = button.dataset.color;
          document
            .querySelectorAll(".swatch")
            .forEach((swatch) => swatch.classList.remove("ring-black"));
          button.classList.add("ring-black");
          productMainImage.style.filter = button.dataset.filter || "none";
          updateProductQuantity();
        });
      });

      document
        .getElementById("detailAddToCart")
        .addEventListener("click", () => {
          addCurrentProductToCart();
          window.location.href = "./cart.html";
        });

      document.getElementById("detailBuyNow").addEventListener("click", () => {
        window.location.href = "./checkout.html";
      });

      document.getElementById("productPlus").addEventListener("click", () => {
        increaseCartQuantity(product.name, {
          size: selectedSize,
          color: selectedColor,
        });
        updateProductQuantity();
      });
      document.getElementById("productMinus").addEventListener("click", () => {
        changeCartQuantity(product.name, -1, {
          size: selectedSize,
          color: selectedColor,
        });
        updateProductQuantity();
      });

      mapProducts(products.slice(0, 4), "relatedProducts");
      document
        .getElementById("relatedProducts")
        ?.querySelectorAll("article")
        .forEach((card) => {
          card.classList.add(
            "w-full",
            "shrink-0",
            "basis-full",
            "lg:basis-0",
            "lg:flex-1",
            "lg:min-w-0",
          );
          const productImage = card.querySelector("a > img");
          productImage?.classList.remove("object-cover", "md:scale-[0.92]");
          productImage?.classList.add("object-contain", "p-2");
        });
      updateProductQuantity();
    </script>
  </body>
</html>
