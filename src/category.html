<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Casual - SHOP.CO</title>
    <link href="./output.css" rel="stylesheet" />
  </head>
  <body>
    <header id="siteHeader"></header>

    <div class="px-6 pt-8 md:px-10">
      <p class="text-lg font-bold text-black">
        <a href="index.html" class="hover:underline">Home</a>
        <span class="px-2 text-gray-400">&gt;</span>
        <a href="category.html" class="hover:underline">Casual</a>
      </p>
    </div>

    <div class="p-6 md:p-10 flex flex-col md:flex-row gap-8">
      <aside class="md:w-64 shrink-0 border rounded-lg p-4 h-fit">
        <h2 class="font-bold text-lg mb-4">Filters</h2>

        <div class="mb-6">
          <h3 class="font-medium mb-2">Category</h3>
          <label class="flex items-center gap-2 mb-1">
            <input type="checkbox" class="filter-category" value="tshirt" />
            T-shirts
          </label>
          <label class="flex items-center gap-2 mb-1">
            <input type="checkbox" class="filter-category" value="shirt" />
            Shirts
          </label>
          <label class="flex items-center gap-2 mb-1">
            <input type="checkbox" class="filter-category" value="polo" /> Polos
          </label>
          <label class="flex items-center gap-2 mb-1">
            <input type="checkbox" class="filter-category" value="jeans" />
            Jeans
          </label>
          <label class="flex items-center gap-2 mb-1">
            <input type="checkbox" class="filter-category" value="shorts" />
            Shorts
          </label>
        </div>

        <div>
          <h3 class="font-medium mb-2">Price</h3>
          <div class="flex items-center gap-2">
            <input
              type="number"
              id="minPrice"
              placeholder="Min"
              class="w-full border rounded-lg px-2 py-1"
            />
            <span>-</span>
            <input
              type="number"
              id="maxPrice"
              placeholder="Max"
              class="w-full border rounded-lg px-2 py-1"
            />
          </div>
        </div>
      </aside>

      <div class="flex-1">
        <div class="mb-6 flex items-center justify-between gap-4">
          <h1 id="categoryTitle" class="text-2xl font-bold">Casual</h1>
          <label class="relative flex items-center gap-2 text-lg font-normal">
            <span>Sort By</span>
            <span class="font-bold" aria-hidden="true">⌄</span>
            <select
              id="sortProducts"
              class="absolute inset-0 h-full w-full cursor-pointer opacity-0"
              aria-label="Sort products"
            >
              <option value="popular">Most Popular</option>
              <option value="quality">Most Quality</option>
              <option value="demanding">Most Demanding</option>
              <option value="high-quality">High Quality</option>
              <option value="less-quality">Less Quality</option>
            </select>
          </label>
        </div>
        <p id="searchMessage" class="mb-4 text-gray-500"></p>
        <div id="categoryGrid" class="flex flex-wrap gap-6"></div>
      </div>
    </div>
    <section id="section2" class="bg-black p-6 md:p-10"></section>
    <footer id="siteFooter"></footer>
    <script src="./section2.js"></script>
    <script src="./footer.js"></script>
    <script src="./header.js"></script>
    <script src="./product.js"></script>
    <script src="./script.js"></script>
  </body>
</html>
